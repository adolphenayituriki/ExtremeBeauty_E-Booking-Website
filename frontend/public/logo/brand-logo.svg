<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&amp;display=swap');
    </style>
  </defs>
  
  <!-- Main brand name "Extreme" -->
  <!-- Decorative capital E with swashes -->
  <g transform="translate(20, 15)">
    <!-- E - main vertical stroke -->
    <path d="M 45 20 C 43 20, 40 22, 38 28 L 38 95 C 38 105, 42 110, 48 112" 
          stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- E - upper horizontal stroke with flourish -->
    <path d="M 38 28 C 35 22, 28 15, 18 12 C 10 10, 2 14, 0 20 C -1 23, 2 26, 8 25 C 14 24, 22 20, 30 22 C 35 23, 38 26, 38 28" 
          stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- E - upper left flourish extending outward -->
    <path d="M 18 12 C 10 8, 2 5, -5 8 C -10 10, -8 18, -2 18 C 4 18, 10 14, 18 12" 
          stroke="#1a1a1a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    
    <!-- E - middle horizontal stroke -->
    <path d="M 38 62 C 30 60, 20 58, 10 62 C 5 64, 3 68, 8 70 C 14 72, 24 68, 32 66" 
          stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- E - lower horizontal stroke with flourish -->
    <path d="M 38 95 C 35 98, 25 105, 12 108 C 5 110, -2 106, 0 100 C 1 96, 6 94, 12 96 C 20 98, 30 102, 38 100" 
          stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- E - lower left flourish extending outward -->
    <path d="M 12 108 C 5 112, -3 118, -8 115 C -12 112, -10 105, -4 104 C 2 103, 8 106, 12 108" 
          stroke="#1a1a1a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    
    <!-- E - decorative thin hairline above -->
    <path d="M 30 18 C 25 10, 15 5, 5 8" 
          stroke="#1a1a1a" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6"/>
    
    <!-- E - decorative thin hairline below -->
    <path d="M 20 115 C 15 120, 8 122, 0 118" 
          stroke="#1a1a1a" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>
  
  <!-- "xtreme" in luxury serif style -->
  <text x="80" y="105" 
        font-family="'Cormorant Garamond', 'Didot', 'Bodoni MT', serif" 
        font-weight="300" 
        font-size="72" 
        fill="#1a1a1a" 
        letter-spacing="2">xtreme</text>
  
  <!-- Subtitle "BEAUTY LASHES & BROWS" -->
  <text x="250" y="145" 
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" 
        font-weight="400" 
        font-size="13" 
        fill="#b8956a" 
        letter-spacing="8"
        text-anchor="middle">BEAUTY LASHES &amp; BROWS</text>
  
  <!-- Subtle gold accent line -->
  <line x1="170" y1="155" x2="330" y2="155" stroke="#b8956a" stroke-width="0.5" opacity="0.4"/>
</svg>
